# Configuração do Nginx pro backend do Estoque de Campo.
# Troque "estoque.suaempresa.com.br" pelo domínio real que você vai usar.
# Depois de configurar, rode o certbot (veja DEPLOY.md) pra gerar o HTTPS
# automaticamente — ele reescreve esse arquivo sozinho adicionando a parte SSL.

limit_req_zone $binary_remote_addr zone=aven_login:10m rate=5r/m;

server {
    listen 80;
    server_name estoque.suaempresa.com.br;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /admin/login {
        limit_req zone=aven_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tecnicos/login {
        limit_req zone=aven_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # uploads de foto podem ser um pouco maiores que o padrão do Nginx
        client_max_body_size 20M;
    }
}
